# CodeRabbit configuration for MuMuManager CLI Menu
# This repo is mostly PowerShell scripts + automation workflows, so the defaults
# below focus on code review ergonomics rather than a generic web-app template.

language:
  - name: powershell
    ignored_files:
      # ZIP/tarballs are not source and are noisy in diffs.
      - '*.zip'
      - '*.tar.gz'

analysis:
  keyword_hints:
    # These are normal local emulator-management operations, not secret hunting.
    - 'MuMuManager.exe'
    - 'adb --vmindex'
    - 'ADP API'

reviews:
  request_body:
    # Keep reviews scoped to what matters for this repo: logic, security in
    # token/storage/DPAPI handling, and file/encoding pitfalls.
    focus:
      - logic
      - security
      - performance

  pull_request:
    comment_on:
      - start
      - review_hours: 1
    auto_review:
      enabled: true
      always: true
    review_groups:
      default:
        developer:
          focus: concise

  language_specific:
    powershell:
      lint_tool: PSScriptAnalyzer
      enable: true

  review_reply:
    enabled: true
    keyword_reply:
      "**Resolver todos los comentarios y aprobar esta PR para continuar con el merge" : >
        This project's primary language is PowerShell. If a review comment
        needs a response, reply in English or Russian.

  summary:
    enabled: true
    include_style_guide_compliance: true
    concise: true
