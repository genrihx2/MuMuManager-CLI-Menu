name: Release

on:
  push:
    branches: [ main ]
    paths: [ 'mumu-menu.ps1' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read script version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content mumu-menu.ps1 -Raw
          $m = [regex]::Match($raw, 'Script version:\s*([\d\.]+)')
          if (-not $m.Success) { throw 'Cannot find Script version' }
          "version=v$($m.Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Create release if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "Version: $VERSION"

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q "${VERSION}"; then
            echo "Tag ${VERSION} already exists - nothing to release"
            exit 0
          fi

          git fetch --quiet --unshallow origin 2>/dev/null || git fetch --quiet --tags origin || true
          LAST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          echo "Previous tag: ${LAST_TAG:-none}"

          mkdir -p dist
          for f in mumu-menu.ps1 README.md SKILL.md update-readme.ps1; do
            [ -f "$f" ] && cp "$f" dist/
          done

          ZIPNAME="MuMuManager-CLI-Menu-${VERSION}.zip"
          (cd dist && zip -r "../${ZIPNAME}" .)

          {
            echo "## MuMuManager CLI Menu ${VERSION}"
            echo ""
            echo "Интерактивное PowerShell-меню для управления MuMu Emulator через официальный \`MuMuManager.exe\`."
            echo ""
            echo "### Что нового"
            if [ -n "$LAST_TAG" ]; then
              git log --no-merges --pretty=format:'- %s' "${LAST_TAG}..HEAD" | head -30 || true
            else
              git log --no-merges --pretty=format:'- %s' HEAD | head -30 || true
            fi
            echo ""
            echo ""
            echo "### Обновление"
            echo "- Через меню: пункт \`[U] Check for updates\` → подтвердите загрузку"
            echo "- Вручную: распакуйте архив и запустите \`mumu-menu.ps1\`"
            echo ""
            echo "### Проверено"
            echo "- VirusTotal: 0 malicious / 0 suspicious (пермалинки в README, раздел «Безопасность»)"
            echo ""
            echo "**Требования:** Windows 10/11 · PowerShell 5.1+ · MuMu Emulator 6.x"
          } > relnotes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

          gh release create "${VERSION}" \
            "${ZIPNAME}" \
            --title "MuMuManager CLI Menu ${VERSION}" \
            --notes-file relnotes.md

          echo "Release ${VERSION} created"
