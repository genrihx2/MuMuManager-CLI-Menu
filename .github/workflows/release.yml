name: Release

on:
  push:
    branches: [ main ]
    paths: [ 'mumu-menu.ps1' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version & check duplicate
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Get-Content mumu-menu.ps1 -Raw
          $m = [regex]::Match($raw, "scriptVer\s*=\s*'([\d\.]+)'|Script version:\s*([\d\.]+)")
          if (-not $m.Success) { throw 'Cannot find Script version' }
          $verNum = if ($m.Groups[1].Success) { $m.Groups[1].Value } else { $m.Groups[2].Value }
          $ver = "v$verNum"
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

          # Ensure tags are available locally
          git fetch --tags 2>$null

          # Skip if tag already exists
          $existing = git ls-remote --tags origin "refs/tags/$ver" 2>$null
          if ($existing -match $ver) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $ver already exists — skipping release"
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

          # Previous tag
          $tags = @(git tag -l 'v*' | Sort-Object { [version]($_ -replace '^v','') } -Descending)
          if ($tags.Count -gt 1 -and $tags[0] -eq $ver) {
            $prev = $tags[1]
            "prev_tag=$prev" >> $env:GITHUB_OUTPUT
            Write-Host "Previous tag: $prev"

            $range = "$prev..HEAD"
            $commits = try { (git log --oneline $range 2>$null | Measure-Object).Count } catch { 0 }
            "commit_count=$commits" >> $env:GITHUB_OUTPUT
            Write-Host "Commits since $prev : $commits"

            $authors = try { git log --format='%an' $range 2>$null | Sort-Object -Unique } catch { @() }
            "contributors=$($authors -join ', ')" >> $env:GITHUB_OUTPUT
          } elseif ($tags.Count -gt 0 -and $tags[0] -ne $ver) {
            $prev = $tags[0]
            "prev_tag=$prev" >> $env:GITHUB_OUTPUT
            Write-Host "Previous tag: $prev"

            $range = "$prev..HEAD"
            $commits = try { (git log --oneline $range 2>$null | Measure-Object).Count } catch { 0 }
            "commit_count=$commits" >> $env:GITHUB_OUTPUT
            Write-Host "Commits since $prev : $commits"

            $authors = try { git log --format='%an' $range 2>$null | Sort-Object -Unique } catch { @() }
            "contributors=$($authors -join ', ')" >> $env:GITHUB_OUTPUT
          } else {
            "commit_count=0" >> $env:GITHUB_OUTPUT
            "contributors=" >> $env:GITHUB_OUTPUT
          }

      - name: Build ZIP
        if: steps.ver.outputs.skip == 'false'
        id: zip
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIPNAME="MuMuManager-CLI-Menu-${VERSION}.zip"

          mkdir -p dist
          for f in mumu-menu.ps1 README.md SKILL.md .version; do
            [ -f "$f" ] && cp "$f" dist/
          done

          (cd dist && zip -r "../${ZIPNAME}" .)

          # SHA256
          SHA256=$(sha256sum "${ZIPNAME}" | cut -d' ' -f1)
          echo "${SHA256}  ${ZIPNAME}" > "${ZIPNAME}.sha256"

          # Stats
          FILE_COUNT=$(unzip -l "${ZIPNAME}" | tail -1 | awk '{print $2}')
          ZIP_SIZE=$(stat -c%s "${ZIPNAME}")
          ZIP_SIZE_KB=$((ZIP_SIZE / 1024))

          echo "zipname=${ZIPNAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "size_kb=${ZIP_SIZE_KB}" >> $GITHUB_OUTPUT

          echo "ZIP: ${ZIPNAME} (${ZIP_SIZE_KB}KB, ${FILE_COUNT} files)"

      - name: Verify ZIP
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          ZIPNAME="${{ steps.zip.outputs.zipname }}"
          SHA256="${{ steps.zip.outputs.sha256 }}"

          echo "${SHA256}  ${ZIPNAME}" | sha256sum -c -
          echo "SHA256: OK"

          for f in mumu-menu.ps1 README.md SKILL.md .version; do
            unzip -l "${ZIPNAME}" | grep -q "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "Structure: OK"

      - name: Generate release notes
        if: steps.ver.outputs.skip == 'false'
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PREV_TAG="${{ steps.ver.outputs.prev_tag }}"
          SHA256="${{ steps.zip.outputs.sha256 }}"
          FILE_COUNT="${{ steps.zip.outputs.file_count }}"
          SIZE_KB="${{ steps.zip.outputs.size_kb }}"
          COMMIT_COUNT="${{ steps.ver.outputs.commit_count }}"

          # Extract changelog from README
          CHANGELOG=$(awk '/^## Что нового/{f=1; next} /^## /{if(f) f=0} f' README.md | sed '/^$/d' | head -40 || true)

          # Generate commit list
          COMMIT_LIST=""
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LIST=$(git log --oneline --no-decorate "$PREV_TAG..HEAD" 2>/dev/null | head -20 || true)
          fi

          # Build notes
          {
            echo "## MuMuManager CLI Menu ${VERSION}"
            echo ""
            echo "Интерактивное PowerShell-меню для управления MuMu Emulator через \`MuMuManager.exe\`."
            echo ""

            # What's new
            echo "### Что нового"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "- Обновление файлов скрипта"
            fi
            echo ""

            # Comparison
            if [ -n "$PREV_TAG" ]; then
              echo "### Сравнение"
              echo "| | |"
              echo "|---|---|"
              echo "| Предыдущая версия | [\`${PREV_TAG}\`](../releases/tag/${PREV_TAG}) |"
              echo "| Текущая версия | \`${VERSION}\` |"
              echo "| Коммитов | ${COMMIT_COUNT} |"
              echo ""
            fi

            # Commits
            if [ -n "$COMMIT_LIST" ]; then
              echo "### Коммиты"
              echo '```'
              echo "$COMMIT_LIST"
              echo '```'
              echo ""
            fi

            # Install
            echo "### Установка"
            echo ""
            echo "**Быстрый запуск** (одна команда):"
            echo '```powershell'
            echo "irm https://raw.githubusercontent.com/${{ github.repository }}/main/mumu-menu.ps1 -OutFile \$env:TEMP\\mumu-menu.ps1; & \$env:TEMP\\mumu-menu.ps1"
            echo '```'
            echo ""
            echo "**Git clone** (с автообновлением через \`[U]\`):"
            echo '```powershell'
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd MuMuManager-CLI-Menu"
            echo ".\\mumu-menu.ps1"
            echo '```'
            echo ""

            # Verification
            echo "### Верификация"
            echo '```powershell'
            echo "# Скачать SHA256:"
            echo "curl -sL https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ZIPNAME}.sha256 -o ${ZIPNAME}.sha256"
            echo "# Проверить:"
            echo "Get-FileHash ${ZIPNAME} -Algorithm SHA256 | Select -Expand Hash"
            echo "# Сравнить с содержимым ${ZIPNAME}.sha256"
            echo '```'
            echo ""

            # Metrics
            echo "### Метрики"
            echo "| | |"
            echo "|---|---|"
            echo "| Размер ZIP | ${SIZE_KB} KB |"
            echo "| Файлов | ${FILE_COUNT} |"
            echo "| SHA256 | \`${SHA256:0:16}...\` |"
            echo ""

            echo "**Требования:** Windows 10/11 · PowerShell 5.1+ · MuMu Emulator 6.x"
          } > relnotes.md

          echo "Release notes generated ($(wc -l < relnotes.md) lines)"

      - name: Create release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIPNAME="${{ steps.zip.outputs.zipname }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

          gh release create "${VERSION}" \
            "${ZIPNAME}" \
            "${ZIPNAME}.sha256" \
            --title "MuMuManager CLI Menu ${VERSION}" \
            --notes-file relnotes.md

          echo "=== Release ${VERSION} created ==="
          echo "URL: https://github.com/${{ github.repository }}/releases/tag/${VERSION}"
