name: Release

on:
  push:
    branches: [ main ]
    paths: [ 'mumu-menu.ps1' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version & check duplicate
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = Get-Content mumu-menu.ps1 -Raw
          $m = [regex]::Match($raw, "scriptVer\s*=\s*'([\d\.]+)'|Script version:\s*([\d\.]+)")
          if (-not $m.Success) { throw 'Cannot find Script version' }
          $verNum = if ($m.Groups[1].Success) { $m.Groups[1].Value } else { $m.Groups[2].Value }
          $ver = "v$verNum"
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

          # Skip if tag already exists
          $existing = git ls-remote --tags origin "refs/tags/$ver" 2>$null
          if ($existing -match $ver) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $ver already exists — skipping release"
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

          # Previous tag for changelog comparison
          $tags = git tag -l 'v*' | Sort-Object { [version]($_ -replace '^v','') } -Descending
          if ($tags.Count -gt 0 -and $tags[0] -ne $ver) {
            "prev_tag=$($tags[0])" >> $env:GITHUB_OUTPUT
            Write-Host "Previous tag: $($tags[0])"
          }

      - name: Build ZIP
        if: steps.ver.outputs.skip == 'false'
        id: zip
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIPNAME="MuMuManager-CLI-Menu-${VERSION}.zip"

          mkdir -p dist
          for f in mumu-menu.ps1 README.md SKILL.md .version; do
            [ -f "$f" ] && cp "$f" dist/
          done

          (cd dist && zip -r "../${ZIPNAME}" .)

          # SHA256
          SHA256=$(sha256sum "${ZIPNAME}" | cut -d' ' -f1)
          echo "${SHA256}  ${ZIPNAME}" > "${ZIPNAME}.sha256"

          # Stats
          FILE_COUNT=$(unzip -l "${ZIPNAME}" | tail -1 | awk '{print $2}')
          ZIP_SIZE=$(stat -c%s "${ZIPNAME}")
          ZIP_SIZE_KB=$((ZIP_SIZE / 1024))

          echo "zipname=${ZIPNAME}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT
          echo "size_kb=${ZIP_SIZE_KB}" >> $GITHUB_OUTPUT

          echo "ZIP: ${ZIPNAME} (${ZIP_SIZE_KB}KB, ${FILE_COUNT} files, sha256: ${SHA256:0:16}...)"

      - name: Verify ZIP integrity
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          ZIPNAME="${{ steps.zip.outputs.zipname }}"
          SHA256="${{ steps.zip.outputs.sha256 }}"

          # Verify checksum
          echo "${SHA256}  ${ZIPNAME}" | sha256sum -c -
          echo "SHA256 verified OK"

          # Verify ZIP structure
          for f in mumu-menu.ps1 README.md SKILL.md .version; do
            if ! unzip -l "${ZIPNAME}" | grep -q "$f"; then
              echo "ERROR: $f missing from ZIP"
              exit 1
            fi
          done
          echo "ZIP structure verified OK"

      - name: Create release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PREV_TAG="${{ steps.ver.outputs.prev_tag }}"
          ZIPNAME="${{ steps.zip.outputs.zipname }}"
          SHA256="${{ steps.zip.outputs.sha256 }}"
          FILE_COUNT="${{ steps.zip.outputs.file_count }}"
          SIZE_KB="${{ steps.zip.outputs.size_kb }}"

          # Changelog
          CHANGELOG=$(awk '/^## Что нового/{f=1; next} /^## /{if(f) f=0} f' README.md | sed '/^$/d' | head -40 || true)

          # Release notes
          {
            echo "## MuMuManager CLI Menu ${VERSION}"
            echo ""
            echo "Интерактивное PowerShell-меню для управления MuMu Emulator через официальный \`MuMuManager.exe\`."
            echo ""
            echo "### Что нового"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "- Обновление файлов скрипта"
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Сравнение"
              echo "- Предыдущая версия: [\`${PREV_TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${PREV_TAG})"
              echo "- Текущая версия: \`${VERSION}\`"
              echo ""
            fi
            echo "### Установка"
            echo ""
            echo "\`\`\`powershell"
            echo "# Быстрый запуск:"
            echo "irm https://raw.githubusercontent.com/${{ github.repository }}/main/mumu-menu.ps1 -OutFile \$env:TEMP\\mumu-menu.ps1; & \$env:TEMP\\mumu-menu.ps1"
            echo ""
            echo "# Или git clone:"
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd MuMuManager-CLI-Menu"
            echo ".\\mumu-menu.ps1"
            echo "\`\`\`"
            echo ""
            echo "### Автообновление"
            echo "- Через меню: пункт \`[U] Check for updates\` → подтвердите загрузку"
            echo "- Скрипт сам скачает ZIP из этого релиза"
            echo ""
            echo "| Метрика | Значение |"
            echo "|---------|----------|"
            echo "| Размер ZIP | ${SIZE_KB} KB |"
            echo "| Файлов в ZIP | ${FILE_COUNT} |"
            echo "| SHA256 | \`${SHA256:0:16}...\` |"
            echo ""
            echo "**Требования:** Windows 10/11 · PowerShell 5.1+ · MuMu Emulator 6.x"
          } > relnotes.md

          # Tag & push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

          # Create release with assets
          gh release create "${VERSION}" \
            "${ZIPNAME}" \
            "${ZIPNAME}.sha256" \
            --title "MuMuManager CLI Menu ${VERSION}" \
            --notes-file relnotes.md

          echo "Release ${VERSION} created"
