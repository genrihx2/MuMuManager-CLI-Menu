name: Release

on:
  push:
    branches: [ main ]
    paths: [ 'mumu-menu.ps1' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read script version
        id: ver
        shell: pwsh
        run: |
          $raw = Get-Content mumu-menu.ps1 -Raw
          $m = [regex]::Match($raw, 'Script version:\s*([\d\.]+)')
          if (-not $m.Success) { throw 'Cannot find Script version' }
          $ver = "v$($m.Groups[1].Value)"
          "version=$ver" >> $env:GITHUB_OUTPUT

          # Get previous tag for comparison
          $tags = git tag -l 'v*' | Sort-Object { [version]($_ -replace '^v','') } -Descending
          if ($tags.Count -gt 0 -and $tags[0] -ne $ver) {
            "prev_tag=$($tags[0])" >> $env:GITHUB_OUTPUT
          } else {
            "prev_tag=" >> $env:GITHUB_OUTPUT
          }

      - name: Create release if new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          PREV_TAG="${{ steps.ver.outputs.prev_tag }}"
          echo "Version: $VERSION"
          echo "Previous: ${PREV_TAG:-none}"

          if git ls-remote --tags origin "refs/tags/${VERSION}" | grep -q "${VERSION}"; then
            echo "Tag ${VERSION} already exists - nothing to release"
            exit 0
          fi

          # Build ZIP
          mkdir -p dist
          for f in mumu-menu.ps1 README.md SKILL.md update-readme.ps1 .version; do
            [ -f "$f" ] && cp "$f" dist/
          done

          ZIPNAME="MuMuManager-CLI-Menu-${VERSION}.zip"
          (cd dist && zip -r "../${ZIPNAME}" .)

          # Generate SHA256 checksum
          SHA256=$(sha256sum "${ZIPNAME}" | cut -d' ' -f1)
          echo "SHA256: ${SHA256}"
          echo "${SHA256}  ${ZIPNAME}" > "${ZIPNAME}.sha256"

          # Count files in ZIP
          FILE_COUNT=$(unzip -l "../${ZIPNAME}" | tail -1 | awk '{print $2}')
          ZIP_SIZE=$(stat -c%s "../${ZIPNAME}" 2>/dev/null || stat -f%z "../${ZIPNAME}")
          ZIP_SIZE_KB=$((ZIP_SIZE / 1024))

          # Extract changelog from README
          CHANGELOG=$(awk '/^## Что нового/{f=1; next} /^## /{if(f) f=0} f' README.md | sed '/^$/d' | head -40 || true)

          # Build release notes
          {
            echo "## MuMuManager CLI Menu ${VERSION}"
            echo ""
            echo "Интерактивное PowerShell-меню для управления MuMu Emulator через официальный \`MuMuManager.exe\`."
            echo ""
            echo "### Что нового"
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "- Обновление файлов скрипта"
            fi
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Сравнение"
              echo "- Предыдущая версия: [\`$PREV_TAG\`](https://github.com/${{ github.repository }}/releases/tag/${PREV_TAG})"
              echo "- Текущая версия: \`${VERSION}\`"
              echo ""
            fi
            echo "### Установка"
            echo ""
            echo "\`\`\`powershell"
            echo "# Быстрый запуск (одна команда):"
            echo "irm https://raw.githubusercontent.com/${{ github.repository }}/main/mumu-menu.ps1 -OutFile \$env:TEMP\\mumu-menu.ps1; & \$env:TEMP\\mumu-menu.ps1"
            echo ""
            echo "# Или git clone + запуск:"
            echo "git clone https://github.com/${{ github.repository }}.git"
            echo "cd MuMuManager-CLI-Menu"
            echo ".\\mumu-menu.ps1"
            echo "\`\`\`"
            echo ""
            echo "### Автообновление"
            echo "- Через меню: пункт \`[U] Check for updates\` → подтвердите загрузку"
            echo "- Скрипт сам скачает ZIP из этого релиза"
            echo ""
            echo "### Проверено"
            echo "- VirusTotal: 0 malicious / 0 suspicious"
            echo "- PSScriptAnalyzer: 0 errors, 0 warnings"
            echo ""
            echo "| Метрика | Значение |"
            echo "|---------|----------|"
            echo "| Размер ZIP | ${ZIP_SIZE_KB} KB |"
            echo "| Файлов в ZIP | ${FILE_COUNT} |"
            echo "| SHA256 | \`${SHA256:0:16}...\` |"
            echo ""
            echo "**Требования:** Windows 10/11 · PowerShell 5.1+ · MuMu Emulator 6.x"
          } > relnotes.md

          # Create tag and release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

          gh release create "${VERSION}" \
            "${ZIPNAME}" \
            "${ZIPNAME}.sha256" \
            --title "MuMuManager CLI Menu ${VERSION}" \
            --notes-file relnotes.md

          echo "Release ${VERSION} created with SHA256: ${SHA256:0:16}..."
