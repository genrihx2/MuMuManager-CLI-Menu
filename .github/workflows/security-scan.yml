name: Security scan (PSScriptAnalyzer)

# CodeQL does not support PowerShell, so code scanning is fed by
# Microsoft's official PowerShell linter (SARIF -> Code Scanning).

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.ps1xml'
      - '.github/workflows/security-scan.yml'
      - 'PSScriptAnalyzerSettings.psd1'
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.ps1xml'
      - '.github/workflows/security-scan.yml'
      - 'PSScriptAnalyzerSettings.psd1'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run PSScriptAnalyzer
        id: scan
        uses: microsoft/psscriptanalyzer-action@2044ae068e37d0161fa2127de04c19633882f061  # v1.0
        with:
          path: .\
          recurse: true
          output: results.sarif
          settings: PSScriptAnalyzerSettings.psd1

      - name: Upload SARIF results
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer

      - name: Summary
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo "### PSScriptAnalyzer: no SARIF output generated" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          TOTAL=$(python3 -c "
          import json, sys
          with open('results.sarif') as f:
              sarif = json.load(f)
          count = 0
          for run in sarif.get('runs', []):
              count += len(run.get('results', []))
          print(count)
          ")
          ERRORS=$(python3 -c "
          import json
          with open('results.sarif') as f:
              sarif = json.load(f)
          c = 0
          for run in sarif.get('runs', []):
              for r in run.get('results', []):
                  if r.get('level') == 'error':
                      c += 1
          print(c)
          ")
          WARNINGS=$(python3 -c "
          import json
          with open('results.sarif') as f:
              sarif = json.load(f)
          c = 0
          for run in sarif.get('runs', []):
              for r in run.get('results', []):
                  if r.get('level') == 'warning':
                      c += 1
          print(c)
          ")
          echo "### PSScriptAnalyzer Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total findings | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "| Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$ERRORS" -gt 0 ]; then
            echo "**Status: FAIL** ($ERRORS error(s))" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          fi
