name: Security scan (PSScriptAnalyzer)

# CodeQL does not support PowerShell, so code scanning is fed by
# Microsoft's official PowerShell linter (SARIF -> Code Scanning).

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.ps1xml'
      - '.github/workflows/security-scan.yml'
      - 'PSScriptAnalyzerSettings.psd1'
  pull_request:
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - '**/*.ps1xml'
      - '.github/workflows/security-scan.yml'
      - 'PSScriptAnalyzerSettings.psd1'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run PSScriptAnalyzer
        id: scan
        uses: microsoft/psscriptanalyzer-action@6b2948b1944407914a58661c49941824d149734f  # v1.1
        with:
          path: .\
          recurse: true
          output: results.sarif
          settings: PSScriptAnalyzerSettings.psd1

      - name: Upload SARIF results
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer

      - name: Summary
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo "### PSScriptAnalyzer: no SARIF output generated" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          TOTAL=$(python3 -c "
          import json, sys
          with open('results.sarif') as f:
              sarif = json.load(f)
          count = 0
          for run in sarif.get('runs', []):
              count += len(run.get('results', []))
          print(count)
          ")
          ERRORS=$(python3 -c "
          import json
          with open('results.sarif') as f:
              sarif = json.load(f)
          c = 0
          for run in sarif.get('runs', []):
              for r in run.get('results', []):
                  if r.get('level') == 'error':
                      c += 1
          print(c)
          ")
          WARNINGS=$(python3 -c "
          import json
          with open('results.sarif') as f:
              sarif = json.load(f)
          c = 0
          for run in sarif.get('runs', []):
              for r in run.get('results', []):
                  if r.get('level') == 'warning':
                      c += 1
          print(c)
          ")
          {
            echo "### PSScriptAnalyzer Results"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total findings | $TOTAL |"
            echo "| Errors | $ERRORS |"
            echo "| Warnings | $WARNINGS |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ERRORS" -gt 0 ]; then
            echo "**Status: FAIL** ($ERRORS error(s))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status: PASS**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail the check on findings
        # Uploading SARIF does NOT gate a pull request: the alerts land in the
        # Security tab (and a fork PR cannot upload at all - its token has no
        # security-events: write), while the check run stays green. A finding
        # therefore became visible only AFTER the merge to main - exactly what
        # happened to the four empty-catch alerts. This step turns the same
        # SARIF into the check's own verdict, so a new alert blocks the PR.
        # The repo carries zero unsuppressed findings today, so anything this
        # reports is new; silence a deliberate one with the project's inline
        # form (see tests/test-devskim-suppressions.ps1 for the rule ids)
        # instead of blanking this gate.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f results.sarif ]; then
            echo "::error::PSScriptAnalyzer produced no SARIF output - the scan did not run"
            exit 1
          fi
          COUNT=$(jq '[.runs[] | (.results // []) | length] | add // 0' results.sarif)
          if [ "$COUNT" -gt 0 ]; then
            {
              echo "### PSScriptAnalyzer: $COUNT finding(s) - this check FAILS"
              echo ''
              echo '```'
              jq -r '.runs[] | (.results // [])[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' results.sarif | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.runs[] | (.results // [])[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' results.sarif | head -20
            exit 1
          fi
          echo 'PSScriptAnalyzer: 0 findings - check passes'
