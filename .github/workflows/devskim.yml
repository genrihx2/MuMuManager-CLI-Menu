# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '33 11 * * 6'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run DevSkim scanner
        # v1.0.11 is broken upstream: its Dockerfile dotnet-installs the
        # current DevSkim CLI (1.0.90 needs net8+), which no longer builds
        # in the net7.0 image (NU1202). Fixed by "Update Dockerfile (#31)"
        # in v1.0.16 - pin that instead.
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6  # v1.0.16

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: devskim-results.sarif
          category: devskim

      - name: Fail the check on findings
        # Uploading SARIF does NOT gate a pull request: the alerts land in the
        # Security tab (and a fork PR cannot upload at all - its token has no
        # security-events: write), while the check run stays green. A finding
        # became visible only AFTER the merge to main. This step turns the same
        # SARIF into the check's own verdict, so a new DevSkim note fails the PR
        # the same way a test failure would. The repo carries zero unsuppressed
        # findings today (every accepted one has an inline
        # `# DevSkim: ignore DSxxxxxx` - validated by
        # tests/test-devskim-suppressions.ps1), so anything reported here is new.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f devskim-results.sarif ]; then
            echo "::error::DevSkim produced no SARIF output - the scan did not run"
            exit 1
          fi
          COUNT=$(jq '[.runs[] | (.results // []) | length] | add // 0' devskim-results.sarif)
          if [ "$COUNT" -gt 0 ]; then
            {
              echo "### DevSkim: $COUNT finding(s) - this check FAILS"
              echo ''
              echo '```'
              jq -r '.runs[] | (.results // [])[] | "\(.ruleId)  \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' devskim-results.sarif | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.runs[] | (.results // [])[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' devskim-results.sarif | head -20
            exit 1
          fi
          echo 'DevSkim: 0 findings - check passes'
