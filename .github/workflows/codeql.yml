# CodeQL Advanced — code scanning for the workflows themselves.
#
# Scope: language 'actions' only. CodeQL has no PowerShell extractor, so the
# menu/bootstrap/diag scripts stay covered by DevSkim + PSScriptAnalyzer
# (devskim.yml, security-scan.yml -> SARIF -> Security tab).
# The repo's Default setup for code scanning is 'not-configured'; this
# Advanced setup is the single CodeQL source and runs on every push/PR to
# main plus a weekly schedule (Monday 04:17 UTC).
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:actions"
