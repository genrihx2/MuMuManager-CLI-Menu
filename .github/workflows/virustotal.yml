name: VirusTotal scan

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scan (e.g. v1.7.0)'
        required: false

permissions:
  contents: write

jobs:
  virustotal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG=$(cat .version)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Scanning tag: $TAG"

      - name: Download release ZIP, verify checksum, unpack
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          ZIPNAME="MuMuManager-CLI-Menu-${TAG}.zip"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          echo "Downloading $ZIPNAME..."
          curl -sL --retry 3 --connect-timeout 15 --max-time 120 \
            -o "$ZIPNAME" "$BASE/$ZIPNAME"

          if [ ! -s "$ZIPNAME" ]; then
            echo "Failed to download ZIP"
            exit 1
          fi

          echo "Downloading checksum sidecar..."
          if curl -sL --retry 3 --connect-timeout 15 --max-time 60 \
               -o "${ZIPNAME}.sha256" "$BASE/${ZIPNAME}.sha256" && [ -s "${ZIPNAME}.sha256" ]; then
            sha256sum -c "${ZIPNAME}.sha256"
          else
            echo "No checksum sidecar - skipping verification"
          fi

          echo "ZIP: $(stat -c%s "$ZIPNAME") bytes"
          echo "SHA256: $(sha256sum "$ZIPNAME" | cut -d' ' -f1)"

          rm -rf scan && mkdir scan
          unzip -q "$ZIPNAME" -d scan
          ls -la scan

      - name: Upload files to VirusTotal and wait for verdicts
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$VT_API_KEY" ]; then
            echo "VT_API_KEY secret not configured"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Files scanned as shipped: the ZIP itself plus the two scripts
          # extracted from that exact ZIP (issue #14 - not just the ZIP).
          : > vt-results.md
          DETECTED=0
          FAILED=0

          for f in "MuMuManager-CLI-Menu-${TAG}.zip" scan/mumu-menu.ps1 scan/SKILL.md; do
            if [ ! -f "$f" ]; then
              echo "Missing file: $f"
              FAILED=1
              continue
            fi

            SHA=$(sha256sum "$f" | cut -d' ' -f1)
            NAME=$(basename "$f")
            case "$NAME" in
              *.zip) DISPLAY="$NAME" ;;
              *)     DISPLAY="$NAME (from ZIP)" ;;
            esac
            echo "=== $DISPLAY ($SHA) ==="

            # Reuse an existing VT object when this content is already known.
            RESP=$(curl -sL --retry 3 --connect-timeout 20 --max-time 60 \
              "https://www.virustotal.com/api/v3/files/$SHA" \
              -H "x-apikey: $VT_API_KEY" || true)
            KNOWN=$(printf '%s' "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print('yes' if d.get('data',{}).get('id')==sys.argv[1] else 'no')" "$SHA" 2>/dev/null || true)

            if [ "$KNOWN" != "yes" ]; then
              echo "Uploading to VirusTotal..."
              RESP=$(curl -sL --connect-timeout 30 --max-time 300 \
                -X POST "https://www.virustotal.com/api/v3/files" \
                -H "x-apikey: $VT_API_KEY" \
                -F "file=@$f")
              ANALYSIS_ID=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('id',''))" 2>/dev/null || true)

              if [ -z "$ANALYSIS_ID" ]; then
                echo "Upload failed for $NAME"
                printf '%s\n' "$RESP" | head -5
                FAILED=1
                continue
              fi
              echo "Analysis ID: $ANALYSIS_ID"

              STATS=""
              for i in $(seq 1 12); do
                sleep 15
                R=$(curl -sL --retry 3 --connect-timeout 20 --max-time 60 \
                  "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
                  -H "x-apikey: $VT_API_KEY")
                STATUS=$(printf '%s' "$R" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data',{}).get('attributes',{}).get('status','unknown'))" 2>/dev/null || true)
                echo "  Attempt $i: status=$STATUS"

                if [ "$STATUS" = "completed" ]; then
                  STATS=$(printf '%s' "$R" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin).get('data',{}).get('attributes',{}).get('stats',{})))")
                  break
                fi
              done

              if [ -z "$STATS" ]; then
                echo "Analysis timed out for $NAME"
                FAILED=1
                continue
              fi
            else
              echo "Already known to VirusTotal - reusing existing report"
              STATS=$(printf '%s' "$RESP" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin).get('data',{}).get('attributes',{}).get('last_analysis_stats',{})))")
            fi

            MALICIOUS=$(printf '%s' "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('malicious',0))")
            SUSPICIOUS=$(printf '%s' "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('suspicious',0))")
            HARMLESS=$(printf '%s' "$STATS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('harmless',0))")

            {
              echo "| \`$DISPLAY\` | \`$SHA\` | $MALICIOUS | $SUSPICIOUS | $HARMLESS | [report](https://www.virustotal.com/gui/file/$SHA) |"
            } >> vt-results.md

            echo "$DISPLAY: malicious=$MALICIOUS suspicious=$SUSPICIOUS"
            if [ "$MALICIOUS" != "0" ] || [ "$SUSPICIOUS" != "0" ]; then
              DETECTED=1
            fi
          done

          if [ "$FAILED" = "1" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$DETECTED" = "1" ]; then
            echo "detections=true" >> "$GITHUB_OUTPUT"
          fi
          echo "status=completed" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          STATUS: ${{ steps.vt.outputs.status }}
          DETECTIONS: ${{ steps.vt.outputs.detections }}
        run: |
          {
            echo "### VirusTotal Scan Results ($TAG)"
            echo ""
            if [ -f vt-results.md ]; then
              echo "| File | SHA-256 | Malicious | Suspicious | Harmless | Report |"
              echo "|---|---|---|---|---|---|"
              cat vt-results.md
              echo ""
            fi
            if [ "$STATUS" = "completed" ]; then
              if [ "$DETECTIONS" = "true" ]; then
                echo "**Status: DETECTIONS FOUND**"
              else
                echo "**Status: CLEAN**"
              fi
            elif [ "$STATUS" = "skipped" ]; then
              echo ""
              echo "VT_API_KEY secret not configured. Add it in Settings -> Secrets and variables -> Actions."
            else
              echo "Scan status: ${STATUS:-not started}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post verdicts to release notes
        # Appends/updates a marker-scoped section in the release body so the
        # verdict table and permalinks are visible where users look first.
        # Idempotent: re-runs replace the previous section (issue #15).
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          STATUS: ${{ steps.vt.outputs.status }}
          DETECTIONS: ${{ steps.vt.outputs.detections }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Only post when we actually scanned and produced a verdict table.
          if [ ! -f vt-results.md ] || [ "$STATUS" != "completed" ]; then
            echo "No completed verdict table (status=${STATUS:-none}) - release notes unchanged"
            exit 0
          fi

          START='<!-- VIRUSTOTAL-VERDICTS:START -->'
          END='<!-- VIRUSTOTAL-VERDICTS:END -->'

          if [ "$DETECTIONS" = "true" ]; then
            VERDICT="**Status: DETECTIONS FOUND - do not use this release**"
          else
            VERDICT="**Status: CLEAN** - 0 malicious / 0 suspicious"
          fi

          TODAY=$(date -u +%Y-%m-%d)

          {
            echo "$START"
            echo ""
            echo "## VirusTotal verdicts"
            echo ""
            echo "| File | SHA-256 | Malicious | Suspicious | Harmless | Report |"
            echo "|---|---|---|---|---|---|"
            cat vt-results.md
            echo ""
            echo "$VERDICT (CI scan $TODAY, [scan run]($RUN_URL))"
            echo ""
            echo "<details><summary>Verify the download yourself</summary>"
            echo ""
            echo '```bash'
            echo "sha256sum -c MuMuManager-CLI-Menu-${TAG}.zip.sha256"
            echo '```'
            echo "</details>"
            echo "$END"
          } > vt-section.md

          RELEASE_JSON=$(gh api "repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          printf '%s' "$RELEASE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['body'] or '')" > release-body.md

          if grep -q "$START" release-body.md; then
            # Replace the existing section (markers inclusive)
            awk -v s="$START" -v e="$END" -v sect=vt-section.md '
              $0 ~ s { inblk=1; while ((getline line < sect) > 0) print line; next }
              inblk && $0 ~ e { inblk=0; next }
              !inblk { print }
            ' release-body.md > release-body-new.md
          else
            # Append the section at the end
            cat release-body.md > release-body-new.md
            echo "" >> release-body-new.md
            cat vt-section.md >> release-body-new.md
          fi

          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -f body="$(cat release-body-new.md)" > /dev/null
          echo "Release notes updated with VirusTotal verdicts"
