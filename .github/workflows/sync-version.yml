name: Sync .version

on:
  push:
    branches: [ main ]
    paths: [ 'mumu-menu.ps1' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync .version from script
        shell: pwsh
        run: |
          $raw = Get-Content mumu-menu.ps1 -Raw
          $m = [regex]::Match($raw, "scriptVer\s*=\s*'([\d\.]+)'|Script version:\s*([\d\.]+)")
          if (-not $m.Success) { throw 'Cannot find Script version' }
          $verNum = if ($m.Groups[1].Success) { $m.Groups[1].Value } else { $m.Groups[2].Value }
          $ver = "v$verNum"
          $current = (Get-Content .version -Raw).Trim()
          if ($current -ne $ver) {
            Set-Content -Path .version -Value $ver -NoNewline
            Write-Host ".version updated: $current -> $ver"
          } else {
            Write-Host ".version already up to date: $ver"
          }

      - name: Commit and push if changed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain .version)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .version
            git commit -m "chore: auto-sync .version"
            git push
          else
            echo ".version already up to date"
          fi
