name: Changelog check

# Guards the release-notes pipeline: the Release workflow builds the
# published release body from the README's «Что нового» sections, so a
# changelog table row without a matching section silently drops that
# version from the release notes (happened to v1.19.1). Fails when any
# table row has no matching section, when a section has no row, when
# either side has duplicates - and when the release version sources
# (relnotes.md top section, .version, mumu-menu.ps1 $scriptVer, plus
# package.json / the package-lock.json root version when present) disagree
# (issue #31; the manifests froze at 10.3.4 for nine releases).

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'relnotes.md'
      - '.version'
      - 'mumu-menu.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/test-changelog-sync.ps1'
      - 'tests/test-dependency-overrides.ps1'
      - '.github/workflows/changelog-check.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'relnotes.md'
      - '.version'
      - 'mumu-menu.ps1'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/test-changelog-sync.ps1'
      - 'tests/test-dependency-overrides.ps1'
      - '.github/workflows/changelog-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog-sync:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check changelog consistency + release version sync (relnotes / .version / scriptVer / manifests)
        shell: pwsh
        run: ./tests/test-changelog-sync.ps1

      # The overrides in package.json closed Dependabot alerts #1-#4. The gate
      # has no package table: the structural layer checks every override against
      # the lockfile, and the advisory layer asks npm audit about the resolved
      # tree, so a NEW advisory fails CI without a code change here. A registry
      # outage fails the step closed instead of passing it quietly.
      - name: Check overrides and npm advisories (structural + npm audit)
        shell: pwsh
        run: ./tests/test-dependency-overrides.ps1

      # Offline: proves the gate still catches a lowered/removed override, a
      # stale or nested lockfile entry, a range instead of a floor, and a new
      # advisory - using synthetic audit reports, no network.
      - name: Self-test the dependency gate
        shell: pwsh
        run: ./tests/test-dependency-overrides.ps1 -SelfTest
