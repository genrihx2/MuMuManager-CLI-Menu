name: Changelog check

# Guards the release-notes pipeline: the Release workflow builds the
# published release body from the README's «Что нового» sections, so a
# changelog table row without a matching section silently drops that
# version from the release notes (happened to v1.19.1). Fails when any
# table row has no matching section, when a section has no row, or when
# either side has duplicates.

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'tests/test-changelog-sync.ps1'
      - '.github/workflows/changelog-check.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'tests/test-changelog-sync.ps1'
      - '.github/workflows/changelog-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changelog-sync:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check changelog consistency (rows <-> «Что нового» sections)
        shell: pwsh
        run: ./tests/test-changelog-sync.ps1
